<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <path d="M60 6 C85 6 106 18 106 42 C106 78 72 104 60 114 C48 104 14 78 14 42 C14 18 35 6 60 6 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" />

  <!-- Inner Subtle Border -->
  <path d="M60 12 C81 12 99 22 99 44 C99 74 69 98 60 106 C51 98 21 74 21 44 C21 22 39 12 60 12 Z" 
        fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Hospital Cross Base -->
  <path d="M48 30 H72 V48 H90 V72 H72 V90 H48 V72 H30 V48 H48 Z" 
        fill="#ffffff" fill-opacity="0.95" />

  <!-- Heart Pulse / ECG Wave (Elektromedik) with Glow -->
  <path d="M22 60 L42 60 L48 44 L54 78 L64 36 L72 74 L78 52 L84 60 L98 60" 
        fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M22 60 L42 60 L48 44 L54 78 L64 36 L72 74 L78 52 L84 60 L98 60" 
        fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Center Glowing Core -->
  <circle cx="60" cy="60" r="4" fill="#ffffff" filter="url(#glow)"/>
</svg>
