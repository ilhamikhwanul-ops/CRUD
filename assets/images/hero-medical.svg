<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow elements -->
  <circle cx="230" cy="140" r="110" fill="#2563eb" fill-opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="340" cy="80" r="60" fill="#06b6d4" fill-opacity="0.15" filter="url(#softGlow)"/>

  <!-- Main Patient Monitor Base & Stand -->
  <path d="M190 220 L270 220 L260 250 L280 255 L180 255 L200 250 Z" fill="#64748b"/>
  <rect x="140" y="250" width="180" height="12" rx="6" fill="#334155"/>

  <!-- Monitor Body -->
  <rect x="90" y="40" width="280" height="185" rx="16" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="94" y="44" width="272" height="177" rx="14" fill="#1e293b"/>

  <!-- Screen Bezel & Display Area -->
  <rect x="106" y="56" width="248" height="152" rx="8" fill="url(#screenGrad)"/>

  <!-- Top Status Bar in Monitor -->
  <rect x="116" y="66" width="60" height="14" rx="4" fill="#334155"/>
  <text x="122" y="77" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">ECG-01</text>
  <circle cx="338" cy="73" r="4" fill="#10b981"/>
  <text x="290" y="77" fill="#94a3b8" font-family="sans-serif" font-size="8">NORMAL</text>

  <!-- Medical Grid Background on Screen -->
  <path d="M116 100 H344 M116 125 H344 M116 150 H344 M116 175 H344" stroke="#334155" stroke-width="0.75" stroke-dasharray="3 3"/>
  <path d="M150 85 V195 M190 85 V195 M230 85 V195 M270 85 V195 M310 85 V195" stroke="#334155" stroke-width="0.75" stroke-dasharray="3 3"/>

  <!-- Vibrant Real-time EKG Wave Line -->
  <path d="M116 135 L160 135 L168 118 L176 158 L188 95 L200 162 L210 125 L220 135 L260 135 L268 120 L276 155 L288 100 L298 160 L308 128 L318 135 L344 135" 
        fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Pulse Heart Rate Big Metric -->
  <text x="122" y="112" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">78</text>
  <text x="150" y="104" fill="#94a3b8" font-family="sans-serif" font-size="8">BPM</text>

  <text x="312" y="112" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold">99%</text>
  <text x="312" y="122" fill="#94a3b8" font-family="sans-serif" font-size="7">SpO2</text>

  <!-- Mini Bottom Trend Wave -->
  <path d="M116 185 Q135 170 155 185 T195 185 T235 185 T275 185 T315 185 L344 185" 
        fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.85"/>

  <!-- Floating Defibrillator / Medical Device Badge Left -->
  <g transform="translate(40, 95)" filter="url(#softGlow)">
    <rect width="64" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="32" cy="32" r="22" fill="#eff6ff"/>
    <path d="M24 32 H40 M32 24 V40" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Shield Certified Badge Right -->
  <g transform="translate(360, 110)" filter="url(#softGlow)">
    <rect width="66" height="66" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="33" cy="33" r="22" fill="#ecfdf5"/>
    <path d="M25 33 L30 38 L41 27" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small Connectivity Pulsing Beacon -->
  <circle cx="370" cy="52" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="370" cy="52" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
</svg>
