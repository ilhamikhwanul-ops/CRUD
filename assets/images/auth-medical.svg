<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="100%" height="100%">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="hubGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Big Ambient Glow -->
  <circle cx="190" cy="160" r="130" fill="url(#glowCircle)" filter="url(#hubGlow)"/>

  <!-- Concentric Tech Radar Rings -->
  <circle cx="190" cy="160" r="110" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="190" cy="160" r="80" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>

  <!-- Central Smart Medical Hub (Isometric Tablet / Console) -->
  <rect x="90" y="80" width="200" height="150" rx="18" fill="url(#hubGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#hubGlow)"/>
  <rect x="96" y="86" width="188" height="138" rx="14" fill="#0f172a"/>

  <!-- Hospital Cross Emblem Inside Hub -->
  <g transform="translate(190, 135)">
    <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M-6 -14 H6 V-6 H14 V6 H6 V14 H-6 V6 H-14 V-6 H-6 Z" fill="#38bdf8"/>
  </g>

  <!-- ECG Signal Running Across -->
  <path d="M106 175 L135 175 L145 160 L155 190 L168 145 L180 195 L190 170 L200 175 L230 175 L240 162 L250 188 L260 175 L274 175" 
        fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#hubGlow)"/>

  <!-- Satellite Nodes (Devices Linked) -->
  <!-- Top Node: Ventilator/ICU -->
  <g transform="translate(190, 40)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
    <path d="M-6 -3 L0 3 L8 -5" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="40" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Left Node: Defibrillator -->
  <g transform="translate(50, 160)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M-3 -6 L3 0 L-2 2 L3 7" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="40" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Right Node: Radiology / Scanner -->
  <g transform="translate(330, 160)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <line x1="-18" y1="0" x2="-40" y2="0" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Bottom Data Stream Bars -->
  <g transform="translate(130, 255)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="16" cy="12" r="5" fill="#10b981"/>
    <text x="30" y="16" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">SECURE ENCRYPTED</text>
  </g>
</svg>
